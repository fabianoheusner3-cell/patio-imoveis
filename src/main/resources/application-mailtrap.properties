# Perfil de teste SMTP Mailtrap Sandbox
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAILTRAP_SMTP_USERNAME:09aeff2964e4fc}
spring.mail.password=${MAILTRAP_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
app.mail.transport=smtp
app.mail.from=${MAILTRAP_FROM:imobiliaria@example.com}
app.mail.test-enabled=${MAIL_TEST_ENABLED:false}
spring.config.import=optional:file:./config/mailtrap-local.properties
spring.mail.properties.mail.smtp.ssl.enable=false
