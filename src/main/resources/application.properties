spring.application.name=TipoImovelPageable
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/tipos-imoveis
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Uploads
app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

# Email em texto via Mailgun
spring.mail.host=${MAILGUN_SMTP_HOST:smtp.mailgun.org}
spring.mail.port=587
spring.mail.username=${MAILGUN_SMTP_USERNAME:}
spring.mail.password=${MAILGUN_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAILGUN_FROM:postmaster@sandboxcc316aecf53f4c4ca11b62ab4ba972aa.mailgun.org}
app.mail.test-enabled=${MAIL_TEST_ENABLED:false}

# API HTTP do Mailgun; MAIL_TRANSPORT=smtp preserva o exemplo do professor
app.mail.transport=${MAIL_TRANSPORT:api}
app.mail.api-key=${MAILGUN_API_KEY:${API_KEY:}}
app.mail.domain=${MAILGUN_DOMAIN:sandboxcc316aecf53f4c4ca11b62ab4ba972aa.mailgun.org}
app.mail.api-base-url=${MAILGUN_API_BASE_URL:https://api.mailgun.net}

# Personalizacao do email de interesse no imovel
app.imobiliaria.nome=${IMOBILIARIA_NOME:Imobiliaria Bairro}
app.imobiliaria.mensagem=${IMOBILIARIA_MENSAGEM:Obrigado pelo interesse! Nossa equipe entrara em contato para esclarecer suas duvidas e combinar uma visita.}

# JWT e criacao do primeiro administrador (somente se nao houver usuarios)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# React e destinatario dos pedidos de interesse
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.contato=${IMOBILIARIA_EMAIL:}
# Evita registrar corpos de login e JWTs nos logs de depuracao
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
